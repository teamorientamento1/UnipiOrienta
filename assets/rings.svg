  <path d="M 153 608.8 A 310 310 0 0 1 -128.8 273.0" fill="none" stroke="#FFCB05" stroke-width="105"/>
  <!-- cobalto, basso sinistra -->
  <circle cx="-40" cy="1040" r="300" fill="none" stroke="#2B3FD6" stroke-width="95"/>
  <!-- verde, sul bordo destro -->
  <circle cx="1930" cy="760" r="350" fill="none" stroke="#2FA470" stroke-width="105"/>
  <!-- arancio con segmento cobalto, in basso -->
  <circle cx="1290" cy="1230" r="330" fill="none" stroke="#F28A18" stroke-width="100"/>
